version: 1.5.0
pr_number: 57
schema_data_changes:
  entries:
  - models:
    - '[twitter_ads__account_report](https://fivetran.github.io/dbt_twitter/#!/model/model.twitter_ads.twitter_ads__account_report)'
    change_type: New column
    is_breaking: false
    notes: Adds `currency`. Twitter (X) ad accounts have no currency field, so it
      is taken from the latest version of the account's campaigns, and left null if
      they use more than one currency. Every other Twitter Ads end model already has
      a campaign currency. See the [DECISIONLOG](https://github.com/fivetran/dbt_twitter/blob/main/DECISIONLOG.md)
      for details.
under_the_hood:
- description: Adds missing campaigns, line items and a promoted tweet to the history
    seeds. Report rows referenced them, so currency and names came out null in the
    campaign, keyword, line item and promoted tweet reports.
date: '2026-11-27'
